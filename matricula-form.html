<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Matrícula</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Sistema de Gerenciamento Acadêmico</h1>
        <span>Área Acadêmica</span>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="alunos.html">Alunos</a></li>
            <li><a href="cursos.html">Cursos</a></li>
            <li><a href="matriculas.html">Matrículas</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
        </ul>
    </nav>
    <main>
        <h2>Cadastro de Matrícula</h2>
        <p>Formulário demonstrativo. Os campos podem ser preenchidos e limpos.</p>
        <form>
            <div class="campo">
                <label for="aluno">Aluno:</label>
                <select id="aluno" name="aluno">
                    <option value="">Selecione o aluno</option>
                    <option value="joao">João Silva</option>
                    <option value="maria">Maria Santos</option>
                    <option value="pedro">Pedro Oliveira</option>
                </select>
            </div>
            <div class="campo">
                <label for="curso">Curso:</label>
                <select id="curso" name="curso">
                    <option value="">Selecione o curso</option>
                    <option value="ads">Análise e Desenvolvimento de Sistemas</option>
                    <option value="cc">Ciência da Computação</option>
                    <option value="si">Sistemas de Informação</option>
                </select>
            </div>
            <div class="campo">
                <label for="data">Data da matrícula:</label>
                <input type="date" id="data" name="data">
            </div>
            <div class="acoes">
                <button type="submit" disabled>Salvar</button>
                <button type="reset" class="botao-secundario">Limpar</button>
            </div>
        </form>
    </main>
</body>
</html>
