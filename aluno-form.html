<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Aluno</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="cabecalho">
        <h1>Sistema de Gerenciamento Acadêmico</h1>
        <span>Área Acadêmica</span>
    </header>
    <nav>
        <ul>
            <li><a href="index.html">Início</a></li>
            <li><a href="alunos.html">Alunos</a></li>
            <li><a href="cursos.html">Cursos</a></li>
            <li><a href="matriculas.html">Matrículas</a></li>
            <li><a href="usuarios.html">Usuários</a></li>
        </ul>
    </nav>
    <main>
        <h2>Cadastro de Aluno</h2>
        <p>Formulário demonstrativo. Os campos podem ser preenchidos e limpos.</p>
        <form>
            <div class="campo">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome">
            </div>
            <div class="campo">
                <label for="cpf">CPF:</label>
                <input type="text" id="cpf" name="cpf">
            </div>
            <div class="campo">
                <label for="email">E-mail:</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="acoes">
                <button type="submit" disabled>Salvar</button>
                <button type="reset" class="botao-secundario">Limpar</button>
            </div>
        </form>
    </main>
</body>
</html>
